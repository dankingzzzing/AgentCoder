name: AgentCoder CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Fixed example regression tests
        run: python -m unittest discover -s examples/fixed -v
      - name: Full three-agent demo
        run: python -m agentcoder demo --json --output artifacts/demo.json
      - name: Direct approval branch
        run: python -m agentcoder demo --scenario clean --json --output artifacts/clean.json
