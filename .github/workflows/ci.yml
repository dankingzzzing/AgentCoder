name: AgentCoder CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Fixed example regression tests
        run: python -m unittest discover -s examples/fixed -v
      - name: Frontend JavaScript syntax
        run: node -e "for (const f of ['app.js','studio.js','workspace.js','continuation.js','markdown.js']) require('node:child_process').execFileSync(process.execPath,['--check','agentcoder/static/'+f],{stdio:'inherit'});"
      - name: Full three-agent demo
        run: python -m agentcoder demo --json --output artifacts/demo.json
      - name: Direct approval branch
        run: python -m agentcoder demo --scenario clean --json --output artifacts/clean.json
      - name: Ten workflow acceptance scenarios
        run: python -m agentcoder evaluate --output artifacts/evaluation.json
      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            artifacts/evaluation.json
            artifacts/evaluation.md
            artifacts/demo.json
            artifacts/clean.json
